name: EVerest CI/CD

on:
  push:
    branches:
      - CI_CD

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            build-essential \
            git \
            libboost-all-dev \
            libssl-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            pkg-config \
            libsystemd-dev \
            libudev-dev \
            libpcap-dev \
            libcap-dev

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build
          restore-keys: |
            ${{ runner.os }}-build

      - name: Build EVerest (incremental)
        run: |
          mkdir -p build
          cd build

          if [ ! -f "Makefile" ]; then
            echo "Running CMake configuration..."
            cmake ..
          else
            echo "CMake already configured, skipping..."
          fi

          make -j$(nproc)

      - name: Install build (optional)
        run: |
          cd build
          make install || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: everest-build
          path: build/
